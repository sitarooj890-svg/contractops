services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-contractops}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Must use service name "db", not localhost, inside Docker network
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://contractops:change-me-locally@db:5432/contractops}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Uploaded contract documents persist on the host at backend/storage.
      - ./backend/storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Live-mount source so Vite hot-reloads on edits.
      - ./frontend:/app
      # Keep container's node_modules out of the Windows bind mount.
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
